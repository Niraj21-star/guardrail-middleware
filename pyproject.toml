[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail-middleware"
version = "0.1.1"
description = "Runtime authorization middleware for AI agent tool calls — policy checks, injection/taint detectors, and a hash-chained audit log, before any action executes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Niraj Sanjay Karnawat" }]
keywords = ["ai-agents", "guardrails", "llm-security", "middleware", "fastapi", "authorization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
fastapi = ["starlette>=0.27", "fastapi>=0.100"]
yaml = ["pyyaml>=6"]
dev = ["pytest>=7", "fastapi>=0.100", "httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/Niraj21-star/guardrail-middleware"
Source = "https://github.com/Niraj21-star/guardrail-middleware"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
